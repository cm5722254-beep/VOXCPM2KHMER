name: cheatz_dabber_mobile
description: "VoxCPM2 Khmer Neural Studio — AI Dubbing, Transcript & Translate"
publish_to: 'none'

version: 4.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  # Premium animations
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.2
  # Storage
  shared_preferences: ^2.3.5
  # Edge TTS WebSocket
  web_socket_channel: ^3.0.0
  # File handling
  path_provider: ^2.1.3
  uuid: ^4.4.0
  # HTTP multipart (for TTS upload to server)
  http_parser: ^4.0.2
  # Permissions
  permission_handler: ^11.3.1
  # Transcript / Translate
  video_player: ^2.9.2
  flutter_markdown: ^0.7.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo.png"
  min_sdk_size: 21
